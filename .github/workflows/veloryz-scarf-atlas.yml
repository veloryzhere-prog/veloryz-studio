name: Generate original scarf motion frame atlases
on:
  push:
    branches: [main]
    paths:
      - "VELORYZ-Studio/scripts/build-scarf-atlas.sh"
      - ".github/workflows/veloryz-scarf-atlas.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scarf-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout original artwork
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install FFmpeg for original video frame extraction
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
      - name: Verify FFmpeg is available
        run: ffmpeg -version | head -n 2
      - name: Generate exact original scarf frames
        run: bash VELORYZ-Studio/scripts/build-scarf-atlas.sh
      - name: Commit pre-rendered video frames to VELORYZ source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VELORYZ-Studio/public/assets/frame-cut/scarf-frames/ VELORYZ-Studio/public/assets/frame-cut/scarf-frames-lite/
          if git diff --cached --quiet; then
            echo "Scarf frame atlases already up-to-date."
          else
            git commit -m "Add adaptive 30fps original scarf frame atlases for smooth GPU-friendly scrolling"
            success=0
            for attempt in 1 2 3 4 5 6 7 8; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                success=1
                break
              fi
              sleep 2
            done
            test "$success" -eq 1
          fi
