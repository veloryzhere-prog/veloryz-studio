name: VELORYZ Studio documentation release gates
on:
  push:
    branches: [main]
    paths:
      - "VELORYZ-Studio/public/**"
      - "VELORYZ-Studio/lib/**"
      - "VELORYZ-Studio/tools/**"
      - "VELORYZ-Studio/src/vendor/lenis/**"
      - "VELORYZ-Studio/src/motion/**"
      - "VELORYZ-Studio/scripts/build-motion.mjs"
      - "VELORYZ-Studio/scripts/build-scroll.mjs"
      - "VELORYZ-Studio/scripts/build-template-gallery.mjs"
      - "VELORYZ-Studio/scripts/template-*.mjs"
      - "VELORYZ-Studio/package.json"
      - "package.json"
      - "wrangler.jsonc"
      - "VELORYZ-Studio/wrangler.jsonc"
      - "VELORYZ-Studio/.node-version"
      - "VELORYZ-Studio/pnpm-lock.yaml"
      - ".github/workflows/veloryz-documentation.yml"
  pull_request:
    paths:
      - "VELORYZ-Studio/**"
permissions:
  contents: read
jobs:
  docs-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: VELORYZ-Studio
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable package manager
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Validate all public guides, routes and links
        run: node tools/test-documentation.mjs
      - name: Validate AI agents, provider security and support UI
        run: node tools/test-knowledge-ai.mjs
      - name: Verify official-logo cinematic intro and existing motion onboarding
        run: node tools/test-brand-intro.mjs
      - name: Validate supplied full-site reference motion, menu and CMS integration
        run: node tools/test-claude-reference.mjs && node tools/test-reference-site-upgrade.mjs && node tools/test-reference-heritage.mjs
      - name: Verify immersive cursor-responsive homepage, official WebGL model, and five real AI portraits
        run: node tools/test-reference-immersive.mjs && node tools/test-logo-model.mjs
      - name: Verify user-controlled V rotation, calibrated original colors, and performant hero-only particles
        run: node tools/test-hero-logo-control-fix.mjs && node tools/test-hero-screenshot-overlap.mjs
      - name: Verify clickable Motion/Menu/Quick Create and stored bug reports
        run: node tools/test-header-bug-report.mjs && node tools/test-bug-report-api.mjs
      - name: Verify universal accessible hover, border, sliding fill and click feedback
        run: node tools/test-button-feedback.mjs && node tools/test-contextual-button-effects.mjs
      - name: Verify all six AI personalities and visible motion recovery
        run: node tools/test-ai-conversation-quality.mjs && node tools/test-motion-chat-regressions.mjs
      - name: Verify smooth closing brand film and 60 FPS opening integration
        run: node tools/test-brand-film.mjs
      - name: Verify project creation and client portal quick action routes
        run: node tools/test-project-shortcuts.mjs
      - name: Verify grounded site knowledge across all nine AI roles and real logo film fallback
        run: node tools/test-public-ai-knowledge.mjs
      - name: Validate kinetic headline typography and no extra scroll loops
        run: node tools/test-kinetic-type-2026.mjs
      - name: Verify responsive visual system and animation performance
        run: node tools/test-studio-fluid.mjs
      - name: Verify mandatory motion welcome and native-friendly Lenis scrolling
        run: node tools/test-smooth-motion.mjs
      - name: Check shared scroll clock, reversible scarf and scroll scenes
        run: node tools/test-motion-clock.mjs && node tools/test-frame-cut.mjs && node tools/test-visual-motion-v4.mjs
      - name: Verify visual-only interactions, mobile behavior, accessibility and true submission outcomes
        run: node tools/test-micro-interactions.mjs
      - name: Verify Motion and Lottie lazy-loading and smooth-scroll isolation
        run: node tools/test-animation-providers.mjs
      - name: Verify visible kinetic animations across all pages
        run: node tools/test-site-kinetics.mjs
      - name: Verify admin sessions, archived media and invitation abuse controls
        run: node tools/test-security-hardening.mjs
      - name: Verify public reviews, owner moderation, HTML docs and India branding
        run: node tools/test-public-reviews.mjs
      - name: Verify immersive reviews, server-only AI, continuous motion and 120-second invitation
        run: node tools/test-review-experience.mjs
      - name: Verify simple Community Feedback UI and working owner Reviews / AI Control Centre
        run: node tools/test-community-admin-v3.mjs
      - name: Verify detailed Studio Control console, AI Mindset and owner actions
        run: node tools/test-admin-detail.mjs
      - name: Verify private client acceptance, Gmail SMTP, PDF and portal lifecycle
        run: node tools/test-client-lifecycle.mjs
      - name: Verify cookie consent, policies and crash-safe admin runtime
        run: node tools/test-privacy-compliance.mjs
      - name: Verify client portal Edge boots and Gmail status is truthful
        run: node tools/test-client-portal-boot.mjs
      - name: Verify one-page industrial order PDF and manual Gmail delivery actions
        run: node tools/test-premium-mail-handoff.mjs
      - name: Verify exact Google Search Console HTML ownership token
        run: node tools/test-google-verification.mjs
      - name: Verify indexable HTML, brand schema and canonical sitemap URLs
        run: node tools/test-search-indexability.mjs
      - name: Verify uploaded VELORYZ Silk motion and UI 2026 integration
        run: node tools/test-silk-ui-2026.mjs
      - name: Validate Cloudflare Worker identity and build runtime
        run: node tools/test-cloudflare-deploy-config.mjs
      - name: Typecheck
        run: corepack pnpm exec tsc --noEmit
      - name: Build production application
        run: corepack pnpm build
      - name: Verify generated Cloudflare Worker output
        run: node tools/test-generated-cloudflare-output.mjs
      - name: Dry-run the exact repository-root Cloudflare deploy config
        working-directory: .
        run: VELORYZ-Studio/node_modules/.bin/wrangler deploy --config wrangler.jsonc --dry-run --outdir "$RUNNER_TEMP/veloryz-root-dryrun"
      - name: Verify bundled first-party Lenis runtime
        run: node tools/test-lenis-bundle.mjs
      - name: Validate R9 finite design scroll, marketplace, journey routes and branded motion
        run: node tools/test-design-market-r9.mjs
      - name: Validate internal VELORYZ design library, sources and creator routes
        run: node tools/test-expanded-design-library.mjs
      - name: Validate original storefront, twelve live templates, and purchase requests
        run: node tools/test-template-store.mjs
