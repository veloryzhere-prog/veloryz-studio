name: Verify VELORYZ live UI deployment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "VELORYZ-Studio/public/veloryz-*.css"
      - "VELORYZ-Studio/public/veloryz-*.js"
      - "VELORYZ-Studio/lib/response-security.ts"
      - "VELORYZ-Studio/lib/claude-reference-shell.ts"
      - "VELORYZ-Studio/lib/site-shell.ts"
      - "VELORYZ-Studio/wrangler.jsonc"
      - "VELORYZ-Studio/.node-version"
      - "VELORYZ-Studio/tools/test-cloudflare-deploy-config.mjs"
      - "VELORYZ-Studio/public/reference-site-upgrade.css"
      - "VELORYZ-Studio/public/reference-restored-features.css"
      - "VELORYZ-Studio/public/external-design-library.js"
      - "VELORYZ-Studio/public/external-design-library.css"
      - "VELORYZ-Studio/tools/test-design-market-r9.mjs"
      - "VELORYZ-Studio/public/reference-elegance-r5.css"
      - "VELORYZ-Studio/public/reference-menu-morph-r6.css"
      - "VELORYZ-Studio/public/reference-site-upgrade.js"
      - "VELORYZ-Studio/public/reference-brand-flow-r17.css"
      - "VELORYZ-Studio/public/reference-brand-flow-r17.js"
      - "VELORYZ-Studio/public/smooth-scroll.js"
      - "VELORYZ-Studio/tools/test-brand-flow-r17.mjs"
      - "VELORYZ-Studio/public/veloryz-experience-r20.css"
      - "VELORYZ-Studio/public/veloryz-experience-r20.js"
      - "VELORYZ-Studio/public/creator-v4.js"
      - "VELORYZ-Studio/public/docs-hub.js"
      - "VELORYZ-Studio/public/knowledge-v4.js"
      - "VELORYZ-Studio/public/knowledge-v4.css"
      - "VELORYZ-Studio/public/veloryz-open-library.js"
      - "VELORYZ-Studio/public/app.js"
      - "VELORYZ-Studio/tools/test-public-experience-r20.mjs"
      - "VELORYZ-Studio/tools/test-reference-menu-r6.mjs"
      - "VELORYZ-Studio/public/reference-hero-immersive.js"
      - "VELORYZ-Studio/public/button-feedback.js"
      - "VELORYZ-Studio/tools/test-reference-elegance-r5.mjs"
      - "VELORYZ-Studio/lib/design-detail-page.ts"
      - "VELORYZ-Studio/tools/check-live-ui-release.mjs"
      - ".github/workflows/veloryz-live-ui-release.yml"
permissions:
  contents: read
jobs:
  live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: VELORYZ-Studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression test actual homepage and Silk interactions
        run: node tools/test-silk-ui-2026.mjs
      - name: Verify active R5 homepage, original logo and menu controls
        run: node tools/test-reference-elegance-r5.mjs
      - name: Verify reference Menu/Close morph and keyboard access
        run: node tools/test-reference-menu-r6.mjs
      - name: Verify R9 finite design stage, actual market renderer and brand feedback
        run: node tools/test-design-market-r9.mjs
      - name: Verify R17 header fade, footer brand frame and smooth-motion profile
        run: node tools/test-brand-flow-r17.mjs
      - name: Verify R20 navigation, conversion, docs, marketplace and accessibility
        run: node tools/test-public-experience-r20.mjs
      - name: Validate Cloudflare Worker identity before probing production
        run: node tools/test-cloudflare-deploy-config.mjs
      - name: Confirm actual live deployment version, rendered markup and motion assets
        env:
          VELORYZ_LIVE_URL: https://veloryz.online
          VELORYZ_UI_RELEASE: silk-ui-20261123-r5
          VELORYZ_PROBE_ATTEMPTS: 20
        run: node tools/check-live-ui-release.mjs
